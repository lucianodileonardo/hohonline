# North Pole Online — Apache httpd site (installed by deploy/apache/deploy.sh)
# Serves the static build from /var/www/north-pole-online over HTTPS.
# @SERVER_NAME@ and @SERVER_ALIASES@ are filled in by the deploy script.

# ---------- Server-wide hardening ----------
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# ---------- HTTP → HTTPS ----------
<VirtualHost *:80>
    ServerName @SERVER_NAME@
    ServerAlias @SERVER_ALIASES@
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# ---------- HTTPS site ----------
<VirtualHost *:443>
    ServerName @SERVER_NAME@
    ServerAlias @SERVER_ALIASES@
    DocumentRoot /var/www/north-pole-online

    <IfModule http2_module>
        Protocols h2 http/1.1
    </IfModule>

    SSLEngine on
    SSLCertificateFile    /etc/pki/tls/certs/north-pole-online.crt
    SSLCertificateKeyFile /etc/pki/tls/private/north-pole-online.key
    SSLProtocol           -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder   off
    SSLSessionTickets     off

    # Static site: no uploads, nothing but GET/HEAD (everything else → 405).
    LimitRequestBody 1024
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$
    RewriteRule ^ - [R=405,L]

    <Directory /var/www/north-pole-online>
        Options -Indexes -Includes -ExecCGI -FollowSymLinks -MultiViews
        AllowOverride None
        Require all granted

        # Features are routed with #hash; unknown paths show the app.
        FallbackResource /index.html
    </Directory>

    # The local CA certificate, so phones/PCs can install it (public file, no secrets).
    <Files "north-pole-online-ca.crt">
        ForceType application/x-x509-ca-cert
        Header always set Content-Disposition "attachment; filename=north-pole-online-ca.crt"
    </Files>

    # Never serve hidden files (.git, .env, …).
    RedirectMatch 404 "/\."

    # ---------- Security headers (same as the nginx container) ----------
    # Keep the CSP in sync with the <meta> tag in index.html.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; worker-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), accelerometer=(), gyroscope=(), magnetometer=(), interest-cohort=()"
    Header always set X-Permitted-Cross-Domain-Policies "none"

    # ---------- Caching ----------
    # Fingerprinted files never change.
    <LocationMatch "^/assets/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/vendor/">
        Header always set Cache-Control "public, max-age=604800"
    </LocationMatch>
    # The page itself must always be revalidated so visitors get new releases.
    <LocationMatch "^/(index\.html)?$">
        Header always set Cache-Control "no-cache"
    </LocationMatch>

    # ---------- Compression ----------
    <IfModule deflate_module>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript text/javascript image/svg+xml application/json
    </IfModule>

    ErrorLog  /var/log/httpd/north-pole-online_error.log
    CustomLog /var/log/httpd/north-pole-online_access.log combined
</VirtualHost>
