# Security headers, included in EVERY location block of nginx.conf.
# (nginx drops server-level add_header directives in any location that defines
#  its own add_header, so they must be repeated via this include.)

# Only our own files may run; map tiles are the only external images.
# Keep in sync with the <meta http-equiv="Content-Security-Policy"> in index.html.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; worker-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), accelerometer=(), gyroscope=(), magnetometer=(), interest-cohort=()" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Enable only when the site is served over HTTPS (e.g. behind a TLS proxy):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
