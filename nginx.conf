server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't reveal the nginx version; no directory listings.
    server_tokens off;
    autoindex off;

    # This is a static site: nobody needs to upload anything.
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;

    # Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/plain image/svg+xml application/json;

    # Only GET/HEAD are allowed anywhere (others get 405).
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Never serve hidden files (.git, .env, …) even if they end up in the image.
    location ~ /\. {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        return 404;
    }

    # Fingerprinted files (app.<hash>.js, style.<hash>.css) never change: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Self-hosted third-party files (Leaflet, fonts).
    location /vendor/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # The page itself must always be fresh so visitors get new releases.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Health check for the container.
    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Anything else → the single page (features are routed with #hash).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
